# GitLab CI：MR 只测试；push dev 部署测试环境；push main 部署生产，并把 main 推到 GitHub。
# GitHub 只收 main。需要 CI 变量 GITHUB_TOKEN（Masked、Protected，环境范围 All）。
#
# 镜像（GitLab Container Registry）：
#   ${CI_REGISTRY_IMAGE}/server:dev|latest
#   ${CI_REGISTRY_IMAGE}/web:dev|latest
#
# 服务器上是独立的 compose 项目 /opt/vectoree-starter，不改 Vectoree 自己的 compose。
# 服务器只 pull 镜像，不在机器上构建。
#
# SSH 变量和 Vectoree 用同一套，建议配在 GitLab Group 上：
#   测试：DEV_DEPLOY_HOST、DEV_DEPLOY_USER、DEV_DEPLOY_SSH_KEY、DEV_DEPLOY_PORT
#   生产：DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_KEY、DEPLOY_PORT、DEPLOY_PATH
# 私钥变量是一行 base64（无空白），Type 用 Variable，可勾 Masked + Hidden + Protected。
# 本机生成：base64 < ~/.ssh/你的私钥 | tr -d '\n'
# 部署目录默认 /opt/vectoree-starter，可用 DEV_DEPLOY_PATH / DEPLOY_PATH 覆盖。

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  tags: [docker]
  interruptible: true

variables:
  DOCKER_BUILDKIT: "1"
  STARTER_SERVER_IMAGE: ${CI_REGISTRY_IMAGE}/server:latest
  STARTER_WEB_IMAGE: ${CI_REGISTRY_IMAGE}/web:latest
  STARTER_SERVER_IMAGE_SHA: ${CI_REGISTRY_IMAGE}/server:${CI_COMMIT_SHA}
  STARTER_WEB_IMAGE_SHA: ${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHA}

stages:
  - check
  - deploy

test:
  stage: check
  image: node:20-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm
  before_script:
    - apt-get update -qq && apt-get install -y -qq ca-certificates >/dev/null
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test
    - npm run typecheck
  timeout: 20m

.deploy:
  stage: deploy
  image: docker:27
  timeout: 45m
  interruptible: false
  needs:
    - test
  before_script:
    - unset DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_TLS_CERTDIR || true
    - apk add --no-cache bash openssh-client
    - |
      set -euo pipefail
      if [[ "${CI_JOB_NAME:-}" == "deploy_development" || "${CI_COMMIT_BRANCH:-}" == "dev" ]]; then
        export DEPLOY_HOST="${DEV_DEPLOY_HOST:-}"
        export DEPLOY_USER="${DEV_DEPLOY_USER:-}"
        export DEPLOY_SSH_KEY="${DEV_DEPLOY_SSH_KEY:-}"
        export DEPLOY_PORT="${DEV_DEPLOY_PORT:-22}"
        export DEPLOY_PATH="${DEV_DEPLOY_PATH:-/opt/vectoree-starter}"
        export DEPLOY_API_BASE_URL="${DEV_DEPLOY_API_BASE_URL:-https://vectoree.net}"
      else
        export DEPLOY_HOST="${DEPLOY_HOST:-}"
        export DEPLOY_USER="${DEPLOY_USER:-}"
        export DEPLOY_SSH_KEY="${DEPLOY_SSH_KEY:-}"
        export DEPLOY_PATH="${DEPLOY_PATH:-/opt/vectoree-starter}"
        export DEPLOY_PORT="${DEPLOY_PORT:-22}"
        export DEPLOY_API_BASE_URL="${DEPLOY_API_BASE_URL:-https://vectoree.ai}"
      fi
      echo "deploy job=${CI_JOB_NAME:-} branch=${CI_COMMIT_BRANCH:-} host=${DEPLOY_HOST:-} path=${DEPLOY_PATH}"
      echo "ssh_auth key=${DEPLOY_SSH_KEY:+yes}"
    - test -n "${DEPLOY_HOST:-}" || (echo "Set DEPLOY_HOST (dev 用 DEV_DEPLOY_HOST)" && exit 1)
    - test -n "${DEPLOY_USER:-}" || (echo "Set DEPLOY_USER (dev 用 DEV_DEPLOY_USER)" && exit 1)
    - test -n "${DEPLOY_SSH_KEY:-}" || (echo "Set DEPLOY_SSH_KEY (dev 用 DEV_DEPLOY_SSH_KEY)。服务器已关闭密码登录。" && exit 1)
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      set -euo pipefail
      echo "=== Build ${STARTER_SERVER_IMAGE} / ${STARTER_WEB_IMAGE} ==="
      docker build --target server \
        -t "$STARTER_SERVER_IMAGE" \
        -t "$STARTER_SERVER_IMAGE_SHA" .
      docker build --target web \
        -t "$STARTER_WEB_IMAGE" \
        -t "$STARTER_WEB_IMAGE_SHA" .
      docker push "$STARTER_SERVER_IMAGE"
      docker push "$STARTER_SERVER_IMAGE_SHA"
      docker push "$STARTER_WEB_IMAGE"
      docker push "$STARTER_WEB_IMAGE_SHA"
    - |
      set -euo pipefail
      SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o Port=${DEPLOY_PORT}"
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      printf '%s' "$DEPLOY_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      SSH="ssh $SSH_OPTS -i ~/.ssh/id_ed25519"
      SCP="scp $SSH_OPTS -i ~/.ssh/id_ed25519"

      PROD_REGISTRY_USER="${REGISTRY_PULL_USER:-$CI_REGISTRY_USER}"
      PROD_REGISTRY_PASSWORD="${REGISTRY_PULL_TOKEN:-$CI_REGISTRY_PASSWORD}"

      $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}/deploy'"
      $SCP docker-compose.deploy.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.deploy.yml"
      $SCP deploy/deploy-remote.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/deploy/deploy-remote.sh"
      $SCP deploy/env.example "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/deploy/env.example"

      $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
        "DEPLOY_PATH='${DEPLOY_PATH}' STARTER_SERVER_IMAGE='${STARTER_SERVER_IMAGE}' STARTER_WEB_IMAGE='${STARTER_WEB_IMAGE}' CI_REGISTRY='${CI_REGISTRY}' CI_REGISTRY_USER='${PROD_REGISTRY_USER}' CI_REGISTRY_PASSWORD='${PROD_REGISTRY_PASSWORD}' DEPLOY_API_BASE_URL='${DEPLOY_API_BASE_URL}' bash -s" <<'REMOTE'
      set -euo pipefail
      cd "$DEPLOY_PATH"
      chmod +x deploy/deploy-remote.sh

      if [[ ! -f .env ]]; then
        echo "=== First deploy: creating .env from deploy/env.example ==="
        cp deploy/env.example .env
        chmod 600 .env
      fi

      echo "=== Login GitLab Container Registry ==="
      echo "$CI_REGISTRY_PASSWORD" | sudo docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      upsert_env() {
        local key="$1" val="$2"
        sudo grep -qE "^[[:space:]]*${key}=" .env && sudo sed -i -E "/^[[:space:]]*${key}=/d" .env
        printf '%s=%s\n' "$key" "$val" | sudo tee -a .env >/dev/null
      }
      upsert_env STARTER_SERVER_IMAGE "$STARTER_SERVER_IMAGE"
      upsert_env STARTER_WEB_IMAGE "$STARTER_WEB_IMAGE"
      upsert_env VECTOREE_API_URL "$DEPLOY_API_BASE_URL"

      echo "=== Disk space ==="
      df -h
      sudo docker system prune -f || true

      echo "=== Pull images / deploy ==="
      export STARTER_SERVER_IMAGE STARTER_WEB_IMAGE VECTOREE_API_URL="$DEPLOY_API_BASE_URL"
      sudo -E bash "$DEPLOY_PATH/deploy/deploy-remote.sh"
      echo "=== Done ==="
      REMOTE

deploy_development:
  extends: .deploy
  resource_group: starter-development-deploy
  environment:
    name: dev
    url: https://vectoree.net
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  variables:
    STARTER_SERVER_IMAGE: ${CI_REGISTRY_IMAGE}/server:dev
    STARTER_WEB_IMAGE: ${CI_REGISTRY_IMAGE}/web:dev
    STARTER_SERVER_IMAGE_SHA: ${CI_REGISTRY_IMAGE}/server:dev-${CI_COMMIT_SHA}
    STARTER_WEB_IMAGE_SHA: ${CI_REGISTRY_IMAGE}/web:dev-${CI_COMMIT_SHA}

deploy_production:
  extends: .deploy
  resource_group: starter-production-deploy
  environment:
    name: production
    url: https://vectoree.ai
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# dev 合并进 main 后，把 GitLab main 推到 GitHub main。
# 没有共同历史时，用一次 --force-with-lease 替换 GitHub 上的旧提交。
# 已经有共同历史但 GitHub 超前时，拒绝覆盖。
publish_github:
  stage: deploy
  image: alpine:3.21
  interruptible: false
  needs:
    - test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - |
      set -euo pipefail
      test -n "${GITHUB_TOKEN:-}" || (echo "Set GITHUB_TOKEN in GitLab CI/CD variables (Masked, Protected, environment All)." && exit 1)
      github_url="https://x-access-token:${GITHUB_TOKEN}@github.com/VectoreeAI/vectoree-starter.git"
      git fetch "$github_url" refs/heads/main
      if git merge-base --is-ancestor FETCH_HEAD HEAD; then
        git push "$github_url" "HEAD:refs/heads/main"
        echo "GitHub main updated"
      elif git merge-base FETCH_HEAD HEAD >/dev/null 2>&1; then
        echo "GitHub main has diverged from GitLab main. Refusing to overwrite."
        exit 1
      else
        remote_sha="$(git rev-parse FETCH_HEAD)"
        echo "GitHub main has no common history. Replacing ${remote_sha} once."
        git push --force-with-lease="refs/heads/main:${remote_sha}" "$github_url" "HEAD:refs/heads/main"
        echo "GitHub main replaced"
      fi
