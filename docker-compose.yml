# Vectoree 托管从 GIT / ZIP 导入时只读这一个文件，必须符合平台 compose 策略：
# 不发布端口、不读宿主文件、不写 container_name、镜像要么 build 要么固定 digest。
# 本机开发的端口、.env、./.vectoree 挂载放在 docker-compose.local.yml：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  server:
    restart: unless-stopped
    build:
      context: .
      target: server
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
    volumes:
      - starter-data:/app/.vectoree

  web:
    restart: unless-stopped
    build:
      context: .
      target: web
    environment:
      API_PROXY: http://server:8787
    expose:
      - "5173"
    depends_on:
      - server

volumes:
  # Keep the explicit {}: Vectoree rewrites this file, and a bare `starter-data:` comes out as '', which Compose rejects.
  starter-data: {}
