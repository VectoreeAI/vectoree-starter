# 服务器上拉镜像启动，不在机器上构建。
#   docker compose -f docker-compose.deploy.yml up -d

name: vectoree-starter

services:
  server:
    image: ${STARTER_SERVER_IMAGE:?set STARTER_SERVER_IMAGE}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      NODE_ENV: production
      VECTOREE_API_URL: ${VECTOREE_API_URL:-https://vectoree.ai}
      DEPLOY_MODE: ${DEPLOY_MODE:-local}
    volumes:
      - starter-data:/app/.vectoree
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/setup/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  web:
    image: ${STARTER_WEB_IMAGE:?set STARTER_WEB_IMAGE}
    restart: unless-stopped
    environment:
      API_PROXY: http://server:8787
    ports:
      - "127.0.0.1:${STARTER_WEB_PORT:-5173}:5173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/starter/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  starter-data:
    driver: local
